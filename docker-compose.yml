services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: core_api
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./services
      dockerfile: core-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/core_api?schema=public
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      JWT_SECRET: ${JWT_SECRET:-trampofacil-local-development-secret}
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
